name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
        # prisma validate resolves env("DATABASE_URL") but does not connect; a placeholder satisfies it.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: pnpm build
      # Run the notify integration tests (wire parity: no parse_mode / literal bytes;
      # ERROR-branch: token never logged). A postgres-free subset — the full `pnpm test`
      # suite needs a DB, which is why the original CI ran build only; these do not.
      - run: pnpm exec tsx --test 'src/notify/*.test.ts'
