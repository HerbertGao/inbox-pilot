# 本 compose 工程现在只提供一样东西：inbox-pilot 用的那个 PostgreSQL 实例。
# app 本身**不再跑在 docker 里**——pilot 由 hangar 以原生 node 进程托管（launchd 常驻 daemon），
# 经 `127.0.0.1:${POSTGRES_HOST_PORT:-5432}`（线上为 5433）连这个库。部署与运维见 docs/DEPLOY.md。
# 后续可能把这个库改由 hangar 统一持有（inbox 以独立 DB 用户接入），届时本文件才会再动。

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mail_router
      POSTGRES_USER: mail_router
      POSTGRES_PASSWORD: mail_router_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_router -d mail_router"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    ports:
      # 仅绑 127.0.0.1（loopback）：postgres **不对外、不上网络**（Tailscale/LAN 不可达），仅宿主本机可连
      # （hangar 托管的 pilot 与宿主侧 migrate/dev 都经此映射连库；远程访问走 ssh 隧道，见 docs/DEPLOY.md）。
      # 宿主端口可被 POSTGRES_HOST_PORT 覆盖以绕开本机端口冲突。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
