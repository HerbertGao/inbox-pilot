services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mail_router
      POSTGRES_USER: mail_router
      POSTGRES_PASSWORD: mail_router_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_router -d mail_router"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    ports:
      # 仅绑 127.0.0.1（loopback）：postgres **不对外、不上网络**（Tailscale/LAN 不可达），仅宿主本机可连
      # （local dev 的宿主侧 migrate/dev 用）；容器化 app 经 @postgres:5432 **内网**连库、不走此映射。
      # 宿主端口可被 POSTGRES_HOST_PORT 覆盖以绕开本机端口冲突。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  inbox-pilot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内 DNS：覆盖 .env 的 localhost 形态为 @postgres:5432。
      DATABASE_URL: postgresql://mail_router:mail_router_password@postgres:5432/mail_router
      # 容器时区：每日摘要定点（DIGEST_TIMES）依赖时区，随 .env 透传（缺省由进程内兜底 Asia/Shanghai）。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 默认 3000:3000；宿主端口可被 APP_HOST_PORT 覆盖以绕开本机端口冲突（与 POSTGRES_HOST_PORT 同模式，多主机部署用）。
      - "${APP_HOST_PORT:-3000}:3000"
