id: inbox
name: Inbox Pilot
executor: pipeline

triggers:
  - type: cron
    # §5.1: 亚小时 cron —— P0 验证码会过期（design D3 P0 时效），notify 耗尽会推迟一个 cron 周期再发。
    #   */3（180s，沿用旧 inbox-pilot 的 POLL_INTERVAL_SECONDS=180）；真实 cadence 可按 §6.1 实测失败率再调。
    schedule: "*/3 * * * *"
    timezone: "Asia/Shanghai"

# 无 tools、无 permissions.approval —— inbox 现状无高危动作，自动动作（reflect/mark_read/notify）在
# run() 内直接编排（design D2），不经 gateway/propose；gmail.send 与任何 approval 动作留 Phase 2。
config: {}
