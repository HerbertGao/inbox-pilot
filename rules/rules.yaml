# inbox-pilot 规则配置（可热重载，改即生效）。
#
# 六类可配置名单，全部可选、各为字符串数组。加载器对每项独立校验：
# 缺失/非法/不可读 → 逐项回落（首次启动用内置默认 / 运行期重载 carry-forward 上一次有效值）。
#
# 安全约定：
#   - 验证码关键词与敏感类别集**不可在此配置**（保持代码内置，守 §12.1 主题→P0 与类别轴硬约束）。
#   - 未知键（含任何凭据/账号/app secret 形态的键）一律被静默丢弃、绝不读取。
#     **绝不**在此文件粘贴任何密钥/口令/token。

# VIP 发件人（精确匹配归一后的发件地址）：命中且邮件为 P2/P3 → 抬升 P1。
vip_senders:
  - ceo@example.com
  - boss@example.com

# 重要发件域（按「等于该域或为其子域」匹配）：命中且邮件为 P2/P3 → 抬升 P1。
important_domains:
  - example.com
  - team.example.org

# 营销关键词（主题命中）：仅把 P2 非敏感邮件下调 P3，绝不碰 P0/P1/P4/敏感邮件。
marketing_keywords:
  - 促销
  - 优惠
  - newsletter
  - unsubscribe

# 安全/支付/敏感关键词：命中（主题或正文）→ 强制不自动标已读。
# 注意：有效集 = 整个内置 SECURITY_PAYMENT_KEYWORDS 常量 ∪ 此处提供的词（只增不减）；
# 此处只能新增，内置承载硬约束的词无法被删除。
security_keywords:
  - 对账单
  - statement

# 发件域永不自动标已读（可选、非决定性补充）：命中发件域 → 强制不自动标已读。
# **本项目不维护域名白名单**——内置默认为空，决定性不标已读全在内容轴（关键词并集 + 类别轴）。
# 留空数组即不配置任何域名（推荐默认）；operator 可按需自填。
never_mark_read_domains: []

# 噪音发件人（operator 手配的过度高评降噪）：匹配发件人精确归一地址 或 发件域（域或子域）。
# 命中且邮件为非敏感 P0/P1/P2 → 下调 P3（静默已读、不入摘要、不推送）；绝不碰 P4/敏感邮件。
# 空数组（默认）= 全 no-op、行为与现状完全一致；operator 可按需自填（如高频 NAS/HKSS 通知源）。
noise_senders: []
